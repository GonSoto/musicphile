{% extends "layout.html" %}

{% block title %}Log In{% endblock %}

{% block main %}
<div class="login-wrapper">
    <div class="auth-card">
        <h1 class="auth-title">Musicphile</h1>
        <p class="auth-subtitle">Sign in to your account.</p>

        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p class="auth-success">{{ success }}</p>
        {% endif %}

        <form action="/login" method="post" class="auth-form">
            <input autocomplete="off" autofocus class="search-input" name="username" placeholder="Username" type="text">
            <input class="search-input" name="password" placeholder="Password" type="password">
            <button class="primary-btn" type="submit">Log In</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="/register">Register here.</a></p>
    </div>
</div>
{% endblock %}
