{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block main %}
<div class="login-wrapper">
    <div class="auth-card">
        <h1 class="auth-title">Musicphile</h1>
        <p class="auth-subtitle">Create an account to get started.</p>

        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% endif %}

        <form action="/register" method="post" class="auth-form">
            <input autocomplete="off" autofocus class="search-input" name="username" placeholder="Username" type="text">
            <input class="search-input" name="password" placeholder="Choose a password" type="password">
            <input class="search-input" name="confirm-password" placeholder="Confirm your password" type="password">
            <button class="primary-btn" type="submit">Register</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="/login">Log in here.</a></p>
    </div>
</div>
{% endblock %}
